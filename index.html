<!-- LAYAR 0: PILIH JENIS SEKOLAH -->
<div id="school-menu-screen" class="card-screen">
  <!-- Tombol Toggle Tema -->
  <div class="theme-toggle-container">
    <button id="theme-toggle-btn" class="theme-btn" onclick="toggleTheme()">
      🌙 Tema Gelap
    </button>
  </div>

  <h2>🏫 Pilih Sekolah</h2>
  <p class="subtitle">Pilih kurikulum/sekolah untuk mulai latihan</p>
  <div class="school-grid">
    <button class="school-btn gmec-btn" onclick="selectSchool('guangming')">
      <span class="school-icon">🌸</span>
      <span class="school-name">Sekolah Guang Ming</span>
      <span class="school-tag">Soal PDF GMEC (Lengkap)</span>
    </button>
    <button class="school-btn general-btn" onclick="selectSchool('general')">
      <span class="school-icon">🏫</span>
      <span class="school-name">Sekolah Lain</span>
      <span class="school-tag">Kurikulum Umum</span>
    </button>
  </div>
</div>
