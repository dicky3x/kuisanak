<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Anak SD - Melingkari & Mencocokkan Gambar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-card">
    <!-- LAYAR SOAL -->
    <div id="quiz-screen">
      <div class="header-info">
        <div id="subject-tag" class="subject-tag">Mata Pelajaran</div>
        <div id="progress-tag" class="progress-tag">1 / 48</div>
      </div>

      <h2 id="question-text">Teks Soal...</h2>
      
      <!-- AREA 1: PILIHAN GANDA (MELINGKARI) -->
      <div class="canvas-container" id="canvas-container">
        <div id="options-container" class="options-container">
          <!-- Opsi jawaban diisi via JS -->
        </div>
        <canvas id="draw-canvas"></canvas>
      </div>

      <!-- AREA 2: MENCOCOKKAN GAMBAR (MENARIK GARIS) -->
      <div class="matching-container hidden" id="matching-container">
        <div class="matching-column" id="left-column"></div>
        <div class="matching-column" id="right-column"></div>
        <canvas id="match-canvas"></canvas>
      </div>

      <p class="instruction" id="instruction-text">💡 Lingkari jawaban dengan jarimu!</p>

      <div class="nav-buttons">
        <button id="prev-btn" onclick="prevQuestion()">⬅️ Sebelumnya</button>
        <button id="reset-btn" onclick="resetCurrentQuestion()">🔄 Hapus Coretan</button>
        <button id="next-btn" onclick="nextQuestion()">Lanjut ➡️</button>
      </div>
    </div>

    <!-- LAYAR HASIL / SKOR (Awalnya Sembunyi) -->
    <div id="result-screen" class="hidden">
      <div class="result-badge">🎉 SELESAI!</div>
      <h2>Hasil Kuis Kamu</h2>
      
      <div class="score-box">
        <div class="score-title">Nilai Akhir</div>
        <div id="final-score" class="score-number">100</div>
      </div>

      <div class="stats-container">
        <div class="stat-item correct">
          <span class="stat-label">Benar</span>
          <span id="correct-count" class="stat-value">0</span>
        </div>
        <div class="stat-item wrong">
          <span class="stat-label">Salah</span>
          <span id="wrong-count" class="stat-value">0</span>
        </div>
      </div>

      <p id="feedback-text" class="feedback-text">Bagus sekali!</p>

      <button id="restart-btn" onclick="restartQuiz()">🔄 Ulangi Kuis</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
