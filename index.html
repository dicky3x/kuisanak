<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Anak SD - Melingkari Jawaban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-card">
    <div class="header-info">
      <div id="subject-tag" class="subject-tag">Mata Pelajaran</div>
      <div id="progress-tag" class="progress-tag">1 / 8</div>
    </div>

    <h2 id="question-text">Teks Soal...</h2>
    
    <div class="canvas-container" id="canvas-container">
      <div id="options-container" class="options-container">
        <!-- Opsi jawaban diisi via JS -->
      </div>
      <canvas id="draw-canvas"></canvas>
    </div>

    <p class="instruction">💡 Lingkari jawaban dengan jarimu!</p>

    <!-- Tombol Navigasi Bawah -->
    <div class="nav-buttons">
      <button id="prev-btn" onclick="prevQuestion()">⬅️ Sebelumnya</button>
      <button id="reset-btn" onclick="resetCurrentQuestion()">🔄 Hapus Coretan</button>
      <button id="next-btn" onclick="nextQuestion()">Lanjut ➡️</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
